name: Heating Stay Cron Sync

on:
  schedule:
    # Minutes décalées de l'heure pile (congestion GitHub Actions) ; filet de secours de pg_cron Supabase (*/15)
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  sync-heating:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Heating Stay Sync Endpoint
        run: |
          curl -fsS -X POST https://hellenvilliers.henri-jamet.com/api/cron/heating-stay-sync \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
